{% extends "base.html" %}
{% block title %}Create Account — REZ.AI{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <span class="brand-mark">REZ.AI / Register</span>
        <h1>Create Account</h1>
        <p class="sub">Start analyzing your resume against any target role.</p>

        <form method="POST" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 characters" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary" style="margin-top: 24px;">
                Create Account →
            </button>
        </form>

        <div class="auth-links">
            <span>Already have an account?</span>
            <a href="/login" class="link-accent">Sign in →</a>
        </div>
    </div>
</div>
{% endblock %}
